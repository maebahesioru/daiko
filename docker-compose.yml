services:
  daiko:
    build: .
    container_name: daiko
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MIN_POST_INTERVAL=${MIN_POST_INTERVAL:-900}
      - MAX_POSTS_PER_HOUR=${MAX_POSTS_PER_HOUR:-4}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-52428800}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - daiko_data:/app/data
    restart: unless-stopped
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.daiko.entrypoints=http
      - traefik.http.routers.daiko.rule=Host(`daiko.hikamer.f5.si`)
      - traefik.http.services.daiko.loadbalancer.server.port=5000

volumes:
  daiko_data:

networks:
  coolify:
    external: true
