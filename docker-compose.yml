services:
  daiko:
    build: .
    container_name: daiko
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MIN_POST_INTERVAL=${MIN_POST_INTERVAL:-900}
      - MAX_POSTS_PER_HOUR=${MAX_POSTS_PER_HOUR:-4}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-15728640}
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "5000:5000"
    volumes:
      - daiko_data:/app/data
    restart: unless-stopped

volumes:
  daiko_data:
