<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者ログイン</title>
<link rel="stylesheet" href="/static/style.css?v=14">
</head>
<body>
<div class="container">
<h1>🔐 管理者ログイン</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash">
{% for cat, msg in messages %}
<p class="flash-{{ cat }}">{{ msg }}</p>
{% endfor %}
</div>
{% endif %}
{% endwith %}

<form method="POST" action="/admin">
<label for="password">パスワード</label>
<input type="password" name="password" id="password" required>
<button type="submit">ログイン</button>
</form>
</div>
<button type="button" onclick="toggleTheme()" class="theme-toggle" id="theme-toggle-btn">◐ テーマ</button>
<script>
(function(){try{var t=localStorage.getItem('daiko_theme');if(t==='light'){document.querySelector('body').setAttribute('data-theme','light');document.getElementById('theme-toggle-btn').textContent='◑ ライト'}else{document.querySelector('body').removeAttribute('data-theme');document.getElementById('theme-toggle-btn').textContent='◐ テーマ'}}catch(e){}})();
function toggleTheme(){try{var b=document.querySelector('body');if(b.getAttribute('data-theme')==='light'){b.removeAttribute('data-theme');localStorage.setItem('daiko_theme','dark');document.getElementById('theme-toggle-btn').textContent='◐ テーマ'}else{b.setAttribute('data-theme','light');localStorage.setItem('daiko_theme','light');document.getElementById('theme-toggle-btn').textContent='◑ ライト'}}catch(e){}}
</script>

</body>
</html>
